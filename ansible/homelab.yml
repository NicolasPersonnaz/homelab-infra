---
# Configuration des VM créées par Terraform, lancée par la CI à travers Teleport.
# gitlab est exclue : elle a son propre playbook (gitlab.yml), lancé depuis gestion.
- name: Configuration des VM du homelab
  hosts: homelab:!gitlab
  become: true
  vars:
    ssh_allowed_sources: "{{ homelab_admin_sources }}"
  roles:
    - common
    - users
    - ssh
    - teleport_node
  post_tasks:
    # La clé jetable de l'amorçage est inutilisable (clé privée détruite avec le job) :
    # on la retire quand même, une fois la VM accessible par Teleport.
    - name: Retirer les clés SSH jetables d'amorçage
      ansible.builtin.lineinfile:
        path: /home/ansible/.ssh/authorized_keys
        regexp: ' bootstrap-job-[0-9]+$'
        state: absent
