---
# Grafana : HTTPS (et redirection HTTP) ouverts au LAN
hardening_firewall_tcp_ports: [80, 443]
# Réception des métriques : seulement depuis les VM du homelab (liste fournie par la CI, sortie Terraform)
hardening_firewall_restricted_ports:
  - port: 9443
    sources: "{{ homelab_vm_ips | default([]) }}"
# Métriques, base et journaux de Grafana : changent en permanence
hardening_aide_exclusions:
  - /var/lib/prometheus
  - /var/lib/grafana
  - /var/log/grafana

# Sauvegarde hebdomadaire vers le NAS (rôle restic) : base Grafana et configuration.
# Plugins réinstallables, historique Prometheus (30 j) régénéré : non sauvegardés.
restic_extra_packages: [sqlite3]
restic_paths:
  - /var/backups/grafana
  - /etc/grafana
restic_pre_commands:
  - install -d -m 700 /var/backups/grafana
  # Copie cohérente de la base SQLite pendant que Grafana tourne
  - sqlite3 /var/lib/grafana/grafana.db ".backup /var/backups/grafana/grafana.db"
restic_post_commands:
  - rm -f /var/backups/grafana/grafana.db
