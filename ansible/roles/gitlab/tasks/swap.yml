---
# Une seule tâche avec « creates » : création, format et activation restent atomiques.
- name: Créer et activer le fichier d'échange
  ansible.builtin.shell: |
    set -e
    fallocate -l {{ gitlab_swap_size_mb }}M /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
  args:
    creates: /swapfile
    executable: /bin/bash

- name: Activer le fichier d'échange au démarrage
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/swapfile\s'
    line: "/swapfile none swap sw 0 0"

- name: Limiter l'usage du swap
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ gitlab_swappiness }}"
    sysctl_file: /etc/sysctl.d/90-gitlab.conf
