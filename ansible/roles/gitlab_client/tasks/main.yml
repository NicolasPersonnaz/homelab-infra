---
- name: Modèle cloud-init de /etc/hosts présent ?
  ansible.builtin.stat:
    path: /etc/cloud/templates/hosts.debian.tmpl
  register: gitlab_client_hosts_template

# Même piège que sur la VM gitlab : cloud-init régénère /etc/hosts depuis ce modèle.
- name: Résolution locale du nom GitLab
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: '\s{{ gitlab_client_hostname | regex_escape }}$'
    line: "{{ gitlab_client_ip }} {{ gitlab_client_hostname }}"
  loop: "{{ ['/etc/hosts'] + (['/etc/cloud/templates/hosts.debian.tmpl'] if gitlab_client_hosts_template.stat.exists else []) }}"

- name: Faire confiance à la CA interne
  ansible.builtin.copy:
    src: "{{ gitlab_client_ca_src }}"
    dest: "{{ gitlab_client_ca_dest }}"
    owner: root
    group: root
    mode: "0644"
  notify: Mettre à jour les CA du système
