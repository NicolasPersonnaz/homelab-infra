---
- name: Dossier des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# Docker Engine : uniquement pour exécuter les jobs, pas le serveur GitLab.
- name: Clé du dépôt Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Dépôt Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
    suites: "{{ ansible_distribution_release }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Installer Docker Engine
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io]
    state: present
    update_cache: true

- name: Activer Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Clé du dépôt GitLab Runner
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/gpgkey/gpg.key
    dest: /etc/apt/keyrings/gitlab-runner.asc
    owner: root
    group: root
    mode: "0644"

- name: Dépôt GitLab Runner
  ansible.builtin.deb822_repository:
    name: gitlab-runner
    types: deb
    uris: "https://packages.gitlab.com/runner/gitlab-runner/{{ ansible_distribution | lower }}"
    suites: "{{ ansible_distribution_release }}"
    components: main
    signed_by: /etc/apt/keyrings/gitlab-runner.asc
    state: present

- name: Installer GitLab Runner (version épinglée)
  ansible.builtin.apt:
    name:
      - "gitlab-runner={{ gitlab_runner_version }}"
      - "gitlab-runner-helper-images={{ gitlab_runner_version }}"
    state: present
    update_cache: true
    allow_change_held_packages: true

- name: Bloquer les mises à jour automatiques du runner
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [gitlab-runner, gitlab-runner-helper-images]

- name: Le runner est-il déjà enregistré ?
  ansible.builtin.command: grep -q '^\[\[runners\]\]' /etc/gitlab-runner/config.toml
  register: gitlab_runner_registered
  changed_when: false
  failed_when: gitlab_runner_registered.rc > 1

- name: Signaler l'absence de jeton
  ansible.builtin.debug:
    msg: >-
      Runner non enregistré : créer un runner d'instance dans GitLab
      (Admin > CI/CD > Runners), puis relancer le playbook et saisir le jeton glrt-.
  when: gitlab_runner_registered.rc != 0 and (gitlab_runner_token | length) == 0

# Le jeton passe par l'environnement (CI_SERVER_TOKEN), pas par la ligne de commande.
- name: Enregistrer le runner (exécuteur Docker, non privilégié)
  ansible.builtin.command:
    argv:
      - gitlab-runner
      - register
      - --non-interactive
      - --url
      - "{{ gitlab_runner_url }}"
      - --tls-ca-file
      - "{{ gitlab_runner_ca_file }}"
      - --name
      - "{{ gitlab_runner_name }}"
      - --executor
      - docker
      - --docker-image
      - "{{ gitlab_runner_docker_image }}"
      - --docker-extra-hosts
      - "{{ gitlab_runner_extra_hosts }}"
  environment:
    CI_SERVER_TOKEN: "{{ gitlab_runner_token }}"
  when: gitlab_runner_registered.rc != 0 and (gitlab_runner_token | length) > 0
  changed_when: true
  no_log: true

- name: Activer le service gitlab-runner
  ansible.builtin.systemd:
    name: gitlab-runner
    enabled: true
    state: started
