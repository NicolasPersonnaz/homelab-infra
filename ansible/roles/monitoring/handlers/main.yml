---
- name: Redémarrer prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted

- name: Redémarrer grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted

# Les deux handlers écoutent le même sujet et s'exécutent dans cet ordre :
# la configuration est vérifiée avant le rechargement.
- name: Vérifier la configuration nginx
  ansible.builtin.command: nginx -t
  changed_when: false
  listen:
    - recharger nginx
    - certificat interne modifié

- name: Recharger nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  listen:
    - recharger nginx
    - certificat interne modifié
