---
- name: Recharger sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Recharger le pare-feu
  ansible.builtin.systemd:
    name: nftables
    state: reloaded

- name: Charger les règles d'audit
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: Appliquer les paramètres noyau
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-durcissement.conf
  changed_when: true
