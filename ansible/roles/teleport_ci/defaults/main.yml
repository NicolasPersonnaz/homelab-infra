---
# Ressources Teleport générées hors du dépôt (vrais noms de domaine) puis appliquées avec tctl.
teleport_ci_output_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/homelab-teleport"
teleport_ci_gitlab_domain: "{{ hostvars[groups['gitlab'][0]]['gitlab_hostname'] }}"
teleport_ci_bot_name: homelab-ci
teleport_ci_role_name: homelab-ci-deployer
teleport_ci_token_name: homelab-ci-gitlab
# Seul ce projet, sur cette branche protégée, peut obtenir l'identité du bot.
teleport_ci_project_path: homelab/homelab-infra
teleport_ci_ref: main
teleport_ci_logins: [ansible]
teleport_ci_node_labels:
  env: homelab
