---
# À la racine (comme site.yml) pour charger group_vars/all.yml.
- name: Serveur GitLab et runner
  hosts: gitlab
  become: true
  vars_prompt:
    - name: gitlab_runner_token
      prompt: "Jeton du runner glrt- (vide si déjà enregistré ou pas encore créé)"
      private: true
      default: ""
    - name: restic_rest_password
      prompt: "Mot de passe du compte rest-server (vide si déjà déposé sur la VM)"
      private: true
      default: ""
    - name: restic_password
      prompt: "Mot de passe du dépôt restic (vide si déjà déposé sur la VM)"
      private: true
      default: ""
  roles:
    # Snapshot Proxmox seulement sur demande : --tags all,snapshot
    - role: proxmox_snapshot
      tags: [never, snapshot]
    - common
    - users
    - ssh
    - gitlab
    - docker_engine
    - gitlab_runner
    - ci_image
    - teleport_node
    - otel_collector
    - hardening
    - role: restic
      tags: [restic]
