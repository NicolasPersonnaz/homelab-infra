# Image construite par le rôle Ansible ci_image sur la VM gitlab (pas de registre).
default:
  image: homelab-ci:1

# Un seul pipeline par push : celui de la merge request s'il y en a une, sinon celui de la branche.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - security
  - deploy

# ---------------------------------------------------
# CHECK : qualité du code d'infrastructure
# ---------------------------------------------------
ansible-lint:
  stage: check
  script:
    - cd ansible
    - ansible-lint --profile production

terraform-validate:
  stage: check
  script:
    - cd terraform
    - terraform fmt -check -recursive -diff
    - terraform init -backend=false -input=false
    - terraform validate

# ---------------------------------------------------
# SECURITY : secrets et code
# ---------------------------------------------------
gitleaks:
  stage: security
  variables:
    GIT_DEPTH: "0"   # tout l'historique : un secret supprimé reste dans Git
  script:
    - gitleaks git --redact --verbose .

semgrep:
  stage: security
  script:
    - semgrep scan --config p/default --metrics=off --error .

# ---------------------------------------------------
# DEPLOY : identité Teleport sans secret (jonction gitlab / OIDC)
# ---------------------------------------------------
# TELEPORT_PROXY et TELEPORT_CLUSTER : variables CI protégées du projet (pas de domaine dans le dépôt).
teleport-check:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  id_tokens:
    TBOT_GITLAB_JWT:
      aud: $TELEPORT_CLUSTER
  script:
    # Bloc littéral : un « : » nu ferait lire la ligne comme une clé YAML.
    - |
      test -n "$TELEPORT_PROXY" || { echo "ERREUR : TELEPORT_PROXY vide"; exit 1; }
    - |
      cat > tbot.yaml <<EOF
      version: v2
      proxy_server: ${TELEPORT_PROXY}
      oneshot: true
      onboarding:
        join_method: gitlab
        token: homelab-ci-gitlab
      storage:
        type: memory
      outputs:
        - type: identity
          destination:
            type: directory
            path: /tmp/tbot
      EOF
    - tbot start -c tbot.yaml
    - tsh -i /tmp/tbot/identity --proxy="$TELEPORT_PROXY" ls
    # Commande exécutée par Teleport sur tous les nœuds env=homelab (pas de SSH direct)
    - tsh -i /tmp/tbot/identity --proxy="$TELEPORT_PROXY" ssh ansible@env=homelab 'hostname; id -un; sudo -n true && echo sudo OK'
